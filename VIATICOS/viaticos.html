<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Control de Viáticos</title>

    <link rel="stylesheet" href="../css/viaticos.css">

</head>

<body>

<div class="contenedor">

    <h2 id="unidadActual">

        Seleccione un Área Presupuestal

    </h2>

    <div class="panel-filtros">

        <div class="fila">

            <div class="titulo">

                ÁREA
                <br>
                PRESUPUESTAL

            </div>

            <div class="contenido">

                <select id="unidad"></select>

            </div>

        </div>

        <div class="fila">

            <div class="titulo">

                MES

            </div>

            <div class="contenido">

                <select id="mes">

                    <option value="">Todos</option>

                    <option>ENERO</option>
                    <option>FEBRERO</option>
                    <option>MARZO</option>
                    <option>ABRIL</option>
                    <option>MAYO</option>
                    <option>JUNIO</option>
                    <option>JULIO</option>
                    <option>AGOSTO</option>
                    <option>SEPTIEMBRE</option>
                    <option>OCTUBRE</option>
                    <option>NOVIEMBRE</option>
                    <option>DICIEMBRE</option>

                </select>

            </div>

        </div>

        <div class="fila">

            <div class="titulo">

                MUNICIPIO

            </div>

            <div class="contenido">

                <input
                    id="municipio"
                    type="text"
                    placeholder="Todos">

            </div>

        </div>

        <div class="fila">

            <div class="titulo">

                SERVIDOR
                <br>
                PÚBLICO

            </div>

            <div class="contenido">

                <input
                    id="servidor"
                    type="text"
                    placeholder="Nombre del servidor">

            </div>

        </div>

        <div class="acciones">

            <button id="buscar">

                Buscar

            </button>

            <button id="nuevo">

                Nuevo Registro

            </button>

        </div>

    </div>

    <div class="cards">

        <div class="card">

            <h3>Presupuesto</h3>

            <span id="totalPresupuesto">

                $0.00

            </span>

        </div>

        <div class="card">

            <h3>Comisiones</h3>

            <span id="totalComisiones">

                0

            </span>

        </div>

        <div class="card">

            <h3>Personas</h3>

            <span id="totalPersonas">

                0

            </span>

        </div>

        <div class="card">

            <h3>Promedio</h3>

            <span id="promedio">

                $0.00

            </span>

        </div>

    </div>

    <div class="tabla">

        <table id="tablaViaticos">

            <thead>

            <tr>

                <th>Nombre</th>
                <th>RFC</th>
                <th>Mes</th>
                <th>Municipio</th>
                <th>Importe</th>
                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<div class="modal" id="modalRegistro">

    <div class="modal-contenido">

        <div class="modal-header">

            <h2>Nuevo Registro</h2>

            <span id="cerrarModal">✖</span>

        </div>

        <div class="tabs">

            <button
                class="tab activa"
                data-tab="manual">

                Captura Manual

            </button>

            <button
                class="tab"
                data-tab="excel">

                Importar Excel

            </button>

        </div>

        <div id="manual" class="tab-content activo">

            <div class="grupo">

                <label>Nombre del Servidor Público</label>

                <input
                    id="nombreRegistro"
                    type="text">

            </div>

            <div class="grupo">

                <label>RFC</label>

                <input
                    id="rfcRegistro"
                    maxlength="13">

            </div>

            <div class="grupo">

                <label>Mes</label>

                <select id="mesRegistro">

                    <option>ENERO</option>
                    <option>FEBRERO</option>
                    <option>MARZO</option>
                    <option>ABRIL</option>
                    <option>MAYO</option>
                    <option>JUNIO</option>
                    <option>JULIO</option>
                    <option>AGOSTO</option>
                    <option>SEPTIEMBRE</option>
                    <option>OCTUBRE</option>
                    <option>NOVIEMBRE</option>
                    <option>DICIEMBRE</option>

                </select>

            </div>

            <div class="grupo">

                <label>Municipio</label>

                <input id="municipioRegistro">

            </div>

            <div class="grupo">

                <label>Importe</label>

                <input
                    id="importeRegistro"
                    type="number">

            </div>

            <button id="guardarRegistro">

                Guardar Registro

            </button>

        </div>

        <div id="excel" class="tab-content">

            <h3>

                Importar desde Excel

            </h3>

            <input
                type="file"
                id="archivoExcel"
                accept=".xlsx,.xls">

            <br><br>

            <button id="importarExcel">

                Importar Archivo

            </button>

        </div>

    </div>

</div>

<script src="../js-viaticos/config.js"></script>
<script src="../js-viaticos/viaticos.js"></script>

</body>

</html>
