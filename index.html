<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso al Sistema</title>

<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/fondo.css">

</head>

<body>

<div class="login-container">

    <!-- HEADER -->
    <div class="login-header">

        <img
            src="img/logo.png"
            class="logo-login"
            alt="Secretaría de Bienestar e Inclusión Social"
        >

        <div class="login-divider"></div>

        <p>Acceso autorizado únicamente</p>

    </div>

    <!-- BODY -->
    <div class="login-body">

        <!-- USUARIO -->
        <div class="form-group">

            <label>Usuario</label>

            <div class="input-wrapper">

                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>

                <input
                    type="text"
                    id="usuario"
                    name="username"
                    placeholder="Ingrese usuario"
                    autocomplete="off"
                >

            </div>

        </div>

        <!-- PASSWORD -->
        <div class="form-group">

            <label>Contraseña</label>

            <div class="input-wrapper">

                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="11" width="16" height="10" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>

                <input
                    type="password"
                    id="password"
                    name="current-password"
                    placeholder="Ingrese contraseña"
                    autocomplete="current-password"
                >

                <span
                    class="toggle-password"
                    id="togglePasswordIcon"
                    onclick="togglePassword()"
                >

                    <svg class="icono-ojo-abierto" width="19" height="19" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg class="icono-ojo-cerrado" width="19" height="19" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="display:none;">
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>

                </span>

            </div>

        </div>

        <!-- BOTÓN LOGIN -->
        <button onclick="login()">
            Iniciar Sesión
        </button>

        <!-- ERROR -->
        <div id="error"></div>

        <!-- FOOTER -->
        <div class="footer">
            Gobierno Digital &bull; Sistema Interno
        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
