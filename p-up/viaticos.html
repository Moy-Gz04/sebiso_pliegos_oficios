<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" href="../favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Viáticos por U.P.</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/ssidebar.css">
    <link rel="stylesheet"
    href="../css/viaticos.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/encabezado-sistemas.css?v=6">
  <link rel="stylesheet" href="../css/minisebiso-flotante.css?v=3">
  <link rel="stylesheet" href="../css/asistente-extra.css?v=2">
  <link rel="stylesheet" href="../css/ventanas-generar.css?v=8">
</head>

<body>

<div id="sidebar-container"></div>

<!--
    .contenido  -> clase que ya usa ssidebar.css para correr el
                   contenido a la derecha del menú fijo.
    .viaticos   -> namespace propio: todas las reglas de viaticos.css
                   quedan dentro de .viaticos ... por lo que nunca
                   pisan botones/inputs/tablas del sidebar u otras
                   páginas que carguen este mismo archivo.
-->
<div class="contenido">

<!-- Viáticos por U.P.: una sola tabla dinámica con todos los registros (js-viaticos/tabla-viaticos.js) -->
<section class="tv">

    <header class="tv-cabeza">
        <div>
            <p class="tv-eyebrow">Administración</p>
            <h1>Viáticos por U.P.</h1>
        </div>
        <div class="tv-acciones">
            <button type="button" class="tv-btn" id="tvImportar"><i class="bi bi-file-earmark-excel"></i> Importar Excel</button>
            <button type="button" class="tv-btn tv-btn-principal" id="tvAgregar"><i class="bi bi-plus-lg"></i> Agregar</button>
            <button type="button" class="tv-btn tv-btn-dorado" id="tvReporte"><i class="bi bi-file-earmark-pdf"></i> Generar reporte</button>
            <input type="file" id="tvArchivo" accept=".xlsx,.xls" hidden>
        </div>
    </header>

    <div class="tv-barra">
        <label class="tv-buscar"><i class="bi bi-search"></i><input type="search" id="tvBuscar" placeholder="Buscar servidor público, RFC, municipio…" aria-label="Buscar"></label>
        <select id="tvMes" aria-label="Filtrar por mes"></select>
        <select id="tvAgrupar" aria-label="Agrupar por">
            <option value="">Sin agrupar</option>
            <option value="up_clave">Agrupar por U.P.</option>
            <option value="nombre_servidor">Agrupar por servidor público</option>
            <option value="mes">Agrupar por mes</option>
            <option value="municipio">Agrupar por municipio</option>
        </select>
        <button type="button" class="tv-limpiar" id="tvLimpiar">Limpiar</button>
    </div>

    <div class="tv-pestanas" id="tvPestanas" role="tablist" aria-label="Unidades presupuestales"></div>

    <div class="tv-tarjeta">
        <div class="tv-scroll">
            <table id="tvTabla">
                <colgroup>
                    <col style="width:96px"><col><col style="width:150px"><col style="width:112px"><col style="width:24%"><col style="width:132px"><col style="width:52px">
                </colgroup>
                <thead>
                    <tr>
                        <th data-campo="up_clave">U.P.</th>
                        <th data-campo="nombre_servidor">Servidor público</th>
                        <th data-campo="rfc">RFC</th>
                        <th data-campo="mes">Mes</th>
                        <th data-campo="municipio">Municipio</th>
                        <th data-campo="importe" class="tv-num">Importe</th>
                        <th class="tv-acc"><span class="tv-oculto">Acciones</span></th>
                    </tr>
                </thead>
                <tbody id="tvCuerpo"></tbody>
            </table>
        </div>
        <!-- totales: fuera del área que se desplaza, siempre en el mismo lugar -->
        <div class="tv-pie">
            <span><b id="tvConteo">0 registros</b> · <span id="tvPersonas">0</span> personas</span>
            <span class="tv-pie-total">Total <b id="tvTotal">$0.00</b></span>
        </div>
    </div>

    <dialog class="tv-dialogo" id="tvDialogo" aria-labelledby="tvDialogoTitulo">
        <form id="tvForm" method="dialog">
            <h2 id="tvDialogoTitulo">Agregar viático</h2>
            <label>U.P.<select id="tvUpForm" required></select></label>
            <label>Servidor público<input id="tvNombre" required maxlength="160" autocomplete="off"></label>
            <div class="tv-dos">
                <label>RFC<input id="tvRfc" required maxlength="13" autocomplete="off" style="text-transform:uppercase"></label>
                <label>Mes<select id="tvMesForm" required></select></label>
            </div>
            <div class="tv-dos">
                <label>Municipio visitado<input id="tvMunicipio" required maxlength="120" autocomplete="off" style="text-transform:uppercase"></label>
                <label>Importe<input id="tvImporte" type="number" min="0.01" step="0.01" required inputmode="decimal"></label>
            </div>
            <div class="tv-dialogo-acc">
                <button type="button" class="tv-btn" id="tvCancelar">Cancelar</button>
                <button type="submit" class="tv-btn tv-btn-principal" id="tvGuardar">Guardar</button>
            </div>
        </form>
    </dialog>

    <dialog class="tv-dialogo tr-dialogo" id="trDialogo" aria-labelledby="trTitulo">
        <form id="trForm" method="dialog">
            <h2 id="trTitulo">Generar reporte</h2>
            <div class="tr-campo">
                <span class="tr-label">Unidad presupuestal <label class="tr-todas"><input type="checkbox" id="trTodas"> Todas</label></span>
                <div class="tr-unidades" id="trUnidades"></div>
            </div>
            <div class="tv-dos">
                <label>Desde<select id="trDesde"></select></label>
                <label>Hasta<select id="trHasta"></select></label>
            </div>
            <label>Fecha del reporte<input type="date" id="trFecha"></label>
            <div class="tr-campo">
                <span class="tr-label">Secciones</span>
                <div class="tr-secciones">
                    <label><input type="checkbox" id="trSecResumen" checked> Resumen</label>
                    <label><input type="checkbox" id="trSecMes" checked> Por mes</label>
                    <label><input type="checkbox" id="trSecPersona" checked> Por servidor público</label>
                    <label><input type="checkbox" id="trSecMunicipio" checked> Municipios</label>
                    <label><input type="checkbox" id="trSecDetalle" checked> Detalle de comisiones</label>
                </div>
            </div>
            <p class="tr-aviso" id="trAviso" role="status"></p>
            <div class="tv-dialogo-acc">
                <button type="button" class="tv-btn" id="trCancelar">Cancelar</button>
                <button type="submit" class="tv-btn tv-btn-principal" id="trGenerar">Generar reporte</button>
            </div>
        </form>
        <div class="tr-vista" id="trVista" hidden>
            <div class="tr-vista-barra">
                <button type="button" class="tv-btn" id="trVolver"><i class="bi bi-arrow-left"></i> Cambiar opciones</button>
                <span>
                    <button type="button" class="tv-btn" id="trImprimir"><i class="bi bi-printer"></i> Imprimir</button>
                    <button type="button" class="tv-btn tv-btn-dorado" id="trDescargar"><i class="bi bi-download"></i> Descargar PDF</button>
                </span>
            </div>
            <iframe id="trFrame" title="Vista previa del reporte"></iframe>
        </div>
    </dialog>

</section>

<style>
.tv{ --g:#5F2132; --g2:#3D1420; --d:#A9824C; --d2:#7C5D31; --borde:#E4D6C8; --suave:#FBF6EE; --txt:#201017; --txt2:#6B5563;
     font-family:'Montserrat',system-ui,sans-serif; color:var(--txt); max-width:1280px; margin:0 auto; padding:24px 24px 48px; box-sizing:border-box; }
.tv *{ box-sizing:border-box; }
.tv-cabeza{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.tv-eyebrow{ margin:0; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--d); }
.tv h1{ margin:2px 0 0; font-size:26px; font-weight:800; color:var(--g); letter-spacing:-.3px; }
.tv-acciones{ display:flex; gap:8px; }
.tv-btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; border:1.5px solid var(--borde); background:#fff; color:var(--g);
         font:600 13px 'Montserrat',sans-serif; cursor:pointer; transition:background .15s,border-color .15s; }
.tv-btn:hover{ background:var(--suave); border-color:var(--d); }
.tv-btn-principal{ background:var(--g); border-color:var(--g); color:#fff; }
.tv-btn-principal:hover{ background:var(--g2); border-color:var(--g2); }
.tv-btn:disabled{ opacity:.6; cursor:wait; }
.tv-btn-dorado{ background:linear-gradient(135deg,#C9A24E,#A9824C); border-color:transparent; color:#3A0818; }
.tv-btn-dorado:hover{ background:linear-gradient(135deg,#D6B062,#B08A3A); border-color:transparent; }
.tr-dialogo{ width:min(620px,94vw); }
.tr-dialogo:has(.tr-vista:not([hidden])){ width:min(900px,96vw); }
.tr-campo{ display:flex; flex-direction:column; gap:6px; }
.tr-label{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--txt2); text-transform:uppercase; letter-spacing:.4px; }
.tr-todas{ flex-direction:row !important; align-items:center; gap:6px !important; text-transform:none !important; letter-spacing:0 !important; font-size:12px !important; color:var(--g) !important; cursor:pointer; }
.tr-unidades{ display:grid; grid-template-columns:minmax(0,1fr); gap:4px; max-height:220px; overflow-y:auto; overflow-x:hidden; padding:2px; }
.tr-up{ min-width:0; }
.tr-up{ flex-direction:row !important; align-items:center; gap:10px !important; padding:7px 10px; border:1px solid #EFE6DA; border-radius:9px; text-transform:none !important; letter-spacing:0 !important;
        font-size:12.5px !important; font-weight:500 !important; color:var(--txt) !important; cursor:pointer; }
.tr-up:hover{ background:var(--suave); }
.tr-up span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tr-up b{ color:var(--g); margin-right:4px; }
.tr-up em{ font-style:normal; font-weight:700; color:var(--txt2); font-size:11.5px; }
.tr-dialogo input[type=checkbox]{ accent-color:#5F2132; width:16px; height:16px; padding:0; }
.tr-secciones{ display:flex; flex-wrap:wrap; gap:6px 16px; }
.tr-secciones label{ flex-direction:row !important; align-items:center; gap:7px !important; text-transform:none !important; letter-spacing:0 !important; font-size:12.5px !important; font-weight:500 !important; color:var(--txt) !important; cursor:pointer; }
.tr-aviso{ margin:0; min-height:1em; font-size:12.5px; color:#A32D2D; }
.tr-vista{ display:flex; flex-direction:column; gap:10px; padding:16px; }
.tr-vista[hidden]{ display:none; }
.tr-vista-barra{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.tr-vista-barra span{ display:flex; gap:8px; }
.tr-vista iframe{ width:100%; height:72vh; border:1px solid var(--borde); border-radius:10px; background:#fff; }
.tv-btn:focus-visible,.tv-limpiar:focus-visible,.tv select:focus-visible,.tv-borrar:focus-visible,.tv-grupo:focus-visible{ outline:2px solid var(--g); outline-offset:2px; }
.tv-barra{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
.tv-buscar{ flex:1 1 280px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1.5px solid var(--borde); border-radius:10px; background:#fff; }
.tv-buscar i{ color:var(--txt2); }
.tv-buscar input{ flex:1; border:0; outline:0; padding:9px 0; font:500 13px 'Montserrat',sans-serif; background:transparent; min-width:0; }
.tv-buscar:focus-within{ border-color:var(--g); box-shadow:0 0 0 3px rgba(95,33,50,.1); }
.tv-barra select{ padding:9px 30px 9px 12px; border:1.5px solid var(--borde); border-radius:10px; background:#fff; font:500 13px 'Montserrat',sans-serif; color:var(--txt); max-width:260px; }
.tv-limpiar{ border:0; background:none; color:var(--txt2); font:600 12.5px 'Montserrat',sans-serif; cursor:pointer; padding:8px 6px; }
.tv-limpiar:hover{ color:var(--g); }
.tv-pestanas{ display:flex; gap:4px; overflow-x:auto; overflow-y:hidden; padding:1px 6px 0; scrollbar-width:none; }
.tv-pestanas::-webkit-scrollbar{ display:none; }
.tv-pestana{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:8px 14px 9px; border:1px solid var(--borde); border-bottom:0;
             border-radius:10px 10px 0 0; background:var(--suave); color:var(--txt2); font:600 12.5px 'Montserrat',sans-serif; cursor:pointer; position:relative; top:1px; }
.tv-pestana small{ font-size:10.5px; font-weight:600; opacity:.8; }
.tv-pestana:hover{ color:var(--g); background:#fff; }
.tv-pestana[aria-selected="true"]{ background:var(--g); border-color:var(--g); color:#fff; }
.tv-pestana:focus-visible{ outline:2px solid var(--d); outline-offset:2px; }
.tv-tarjeta{ border-top-left-radius:0 !important; }
.tv-tarjeta{ background:#fff; border:1px solid var(--borde); border-radius:14px; box-shadow:0 1px 2px rgba(32,16,23,.04), 0 8px 24px rgba(32,16,23,.05); overflow:hidden; }
/* altura fija: la tabla mide lo mismo con 6 o con 134 registros, no brinca al cambiar de U.P. */
.tv-scroll{ height:max(300px, calc(100vh - 412px)); overflow-y:auto; overflow-x:hidden; scrollbar-gutter:stable; }
#tvTabla{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
#tvTabla td{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#tvTabla th{ position:sticky; top:0; z-index:1; background:var(--g); color:#fff; text-align:left; padding:11px 12px; font-weight:700; font-size:12px; letter-spacing:.3px; white-space:nowrap; }
#tvTabla th[data-campo]{ cursor:pointer; user-select:none; }
#tvTabla th[data-campo]::after{ content:"↕"; margin-left:6px; opacity:.35; font-size:11px; }
#tvTabla th[data-orden="asc"]::after{ content:"↑"; opacity:1; color:#E7CD86; }
#tvTabla th[data-orden="desc"]::after{ content:"↓"; opacity:1; color:#E7CD86; }
#tvTabla td{ padding:9px 12px; border-bottom:1px solid #F1EAE1; vertical-align:middle; }
#tvTabla tbody tr:hover td{ background:var(--suave); }
.tv-pie{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 104px 12px 18px; background:#F6EEDD; border-top:2px solid var(--d); color:var(--g); font-size:13px; }
.tv-pie-total{ font-variant-numeric:tabular-nums; }
.tv-pie-total b{ font-size:15px; margin-left:6px; }
.tv-num{ text-align:right !important; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tv-mono{ font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--txt2); }
.tv-up{ display:inline-block; padding:2px 8px; border-radius:999px; background:#F9F0F3; color:var(--g); font-weight:700; font-size:11.5px; white-space:nowrap; }
.tv-acc{ width:44px; text-align:center !important; }
.tv-borrar{ width:28px; height:28px; border-radius:50%; border:0; background:none; color:#B5A6AD; cursor:pointer; font-size:13px; }
.tv-borrar:hover{ background:#FCE4EC; color:#A32D2D; }
.tv-grupo td{ background:#FBF7F2; cursor:pointer; font-size:13px; }
.tv-grupo:hover td{ background:#F6EEDD !important; }
.tv-flecha{ display:inline-block; width:14px; color:var(--d2); }
.tv-cuenta{ margin-left:8px; font-size:11.5px; color:var(--txt2); }
.tv-detalle td:first-child{ padding-left:30px; }
.tv-vacio{ text-align:center; padding:40px 12px !important; color:var(--txt2); white-space:normal !important; }
#tvTabla tbody tr:nth-child(even):not(.tv-grupo) td{ background:#FDFBF8; }
.tv-grupo td{ white-space:nowrap; }
.tv-oculto{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.tv-dialogo{ border:0; border-radius:16px; padding:0; width:min(520px,92vw); box-shadow:0 30px 80px rgba(20,6,12,.35); }
.tv-dialogo::backdrop{ background:rgba(30,10,18,.45); }
.tv-dialogo form{ display:flex; flex-direction:column; gap:12px; padding:22px 24px; font-family:'Montserrat',sans-serif; }
.tv-dialogo h2{ margin:0 0 4px; font-size:18px; color:var(--g); }
.tv-dialogo label{ display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-weight:700; color:var(--txt2); text-transform:uppercase; letter-spacing:.4px; }
.tv-dialogo input,.tv-dialogo select{ padding:9px 11px; border:1.5px solid var(--borde); border-radius:9px; font:500 13.5px 'Montserrat',sans-serif; color:var(--txt); text-transform:none; letter-spacing:0; }
.tv-dialogo input:focus,.tv-dialogo select:focus{ outline:0; border-color:var(--g); box-shadow:0 0 0 3px rgba(95,33,50,.1); }
.tv-dos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tv-dialogo-acc{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
@media (max-width:720px){ .tv{ padding:16px 12px 40px; } .tv-barra select{ flex:1 1 45%; max-width:none; } .tv-dos{ grid-template-columns:1fr; } }
</style>

<!-- contenedor de estilos de css/viaticos.css (la ventana de cerrar sesión los usa) -->
<div class="viaticos">
<!--======================================
        MODAL CERRAR SESIÓN
=======================================-->

<div class="modal" id="modalLogout">

    <div class="modal-contenido" style="width:420px;">

        <div class="modal-header">

            <div>

                <h2>

                    <i class="bi bi-box-arrow-right"></i>

                    Cerrar Sesión

                </h2>

                <small>

                    ¿Estás seguro que deseas cerrar sesión?

                </small>

            </div>

        </div>

        <div class="tab-content activo">

            <div class="footer-modal" style="margin-top:0;">

                <button type="button" class="btn-cancelar" onclick="cerrarModal('modalLogout')">

                    <i class="bi bi-x-circle"></i>

                    Cancelar

                </button>

                <button type="button" class="btn-principal" id="confirmarLogout">

                    <i class="bi bi-box-arrow-right"></i>

                    Cerrar Sesión

                </button>

            </div>

        </div>

    </div>

</div>

</div>
</div>

</body>
